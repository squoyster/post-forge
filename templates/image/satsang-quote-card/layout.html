<!doctype html>
<html>
<head><meta charset="utf-8" /><link rel="stylesheet" href="./styles.css" /></head>
<body>
  <main class="card">
    <div class="watermark">ॐ</div>
    <header>
      <div class="eyebrow">{{seriesLabel}}</div>
      <div class="divider"></div>
    </header>
    <section class="quote">“{{quote}}”</section>
    <section class="speaker">— {{speaker}}</section>
    {{#if reflection}}<section class="reflection">{{reflection}}</section>{{/if}}
    <footer><span class="topic">{{topic}}</span><span class="brand">DKMC Satsang</span></footer>
  </main>
</body>
</html>
